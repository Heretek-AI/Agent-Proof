name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM distribution tag (e.g. latest, beta, next)'
        required: true
        default: 'latest'
      bump:
        description: 'Version bump strategy (auto, patch, minor, major, none)'
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - none
        default: 'auto'
      dry_run:
        description: 'Perform dry run without publishing'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for OpenID Connect (OIDC) trusted publishing & npm provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Upgrade npm to latest for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install

      - name: Resolve & Auto-Increment Version
        id: version
        run: |
          LATEST_NPM=$(npm view @heretek-ai/agent-proof version 2>/dev/null || echo "0.0.0")
          CURRENT_PKG=$(node -p "require('./package.json').version")
          echo "Latest version published on NPM: $LATEST_NPM"
          echo "Local package.json version: $CURRENT_PKG"

          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Publishing tagged release: $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          elif [ "${{ inputs.bump }}" = "none" ]; then
            echo "Skipping version bump as requested"
          else
            TARGET_VERSION=$(node -e '
              const currentPkg = process.argv[1];
              const latestNpm = process.argv[2] || "0.0.0";
              const bumpType = process.argv[3] || "auto";

              function parse(v) {
                return v.replace(/^v/, "").split(".").map(n => parseInt(n, 10) || 0);
              }
              function isGte(v1, v2) {
                const [a1, a2, a3] = parse(v1);
                const [b1, b2, b3] = parse(v2);
                if (a1 !== b1) return a1 > b1;
                if (a2 !== b2) return a2 > b2;
                return a3 >= b3;
              }

              let targetVersion = currentPkg;
              if (latestNpm !== "0.0.0" && isGte(latestNpm, currentPkg)) {
                const [major, minor, patch] = parse(latestNpm);
                if (bumpType === "major") targetVersion = `${major + 1}.0.0`;
                else if (bumpType === "minor") targetVersion = `${major}.${minor + 1}.0`;
                else targetVersion = `${major}.${minor}.${patch + 1}`;
              } else if (bumpType === "major" || bumpType === "minor" || bumpType === "patch") {
                const [major, minor, patch] = parse(currentPkg);
                if (bumpType === "major") targetVersion = `${major + 1}.0.0`;
                else if (bumpType === "minor") targetVersion = `${major}.${minor + 1}.0`;
                else targetVersion = `${major}.${minor}.${patch + 1}`;
              }
              console.log(targetVersion);
            ' "$CURRENT_PKG" "$LATEST_NPM" "${{ inputs.bump || 'auto' }}")

            echo "Setting package version to: $TARGET_VERSION"
            npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version
          fi

          FINAL_VERSION=$(node -p "require('./package.json').version")
          echo "Target publish version: $FINAL_VERSION"
          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT

      - name: Build bundle
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Run real-world sandbox verification
        run: npm run test:real-repo

      - name: Inspect Package Contents
        run: npm pack --dry-run

      - name: Publish to NPM Registry (Trusted Publishing via OIDC)
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance --tag ${{ inputs.tag || 'latest' }}

      - name: Dry Run Publish
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public --tag ${{ inputs.tag || 'latest' }}
